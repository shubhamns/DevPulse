services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - devpulse_mongo_data:/data/db

  api:
    build:
      context: ./backend
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: production
      PORT: 4000
      MONGODB_URI: mongodb://mongo:27017/devpulse
      FRONTEND_URL: http://localhost:5173
      CORS_ORIGIN: http://localhost:5173
      JWT_SECRET: ${JWT_SECRET:-local-docker-jwt-secret-at-least-32-characters-long}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GITHUB_CALLBACK_URL: ${GITHUB_CALLBACK_URL:-http://localhost:4000/api/v1/github/callback}
    depends_on:
      - mongo

volumes:
  devpulse_mongo_data:
